<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫画と音声で見る動画ライブラリ</title><link rel="stylesheet" href="/watch/watch.css"></head>
<body><header><div><p class="eyebrow">VIDEO LIBRARY</p><h1>漫画と音声で、ひとつずつ。</h1><p>図解を見ながらナレーションを聴く、縦型動画のライブラリ。</p></div><span id="count" aria-live="polite"></span></header>
<main><section class="viewer" aria-label="動画プレイヤー"><div class="screen"><video id="player" controls playsinline preload="metadata" aria-label="選択した動画"></video><p id="empty">動画を読み込んでいます…</p></div><h2 id="now-title">動画を選んでください</h2><div class="controls"><button id="previous" disabled>← 前の動画</button><button id="next" disabled>次の動画 →</button><label for="playback-rate">再生速度 <select id="playback-rate"><option value="0.5">0.5倍</option><option value="0.75">0.75倍</option><option value="1" selected>1倍（標準）</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option><option value="1.75">1.75倍</option><option value="2">2倍</option></select></label><label><input id="continuous" type="checkbox" checked>連続再生</label><label><input id="repeat" type="checkbox">最後から先頭へ</label></div><p id="message" role="status">一覧から動画を選ぶと再生できます。</p><button id="share" disabled>この動画のリンクをコピー</button></section>
<section class="library" aria-label="動画一覧"><label for="search">タイトルで探す</label><input id="search" type="search" placeholder="キーワードを入力"><p id="list-status" role="status"></p><div id="list"></div></section></main><footer>音声付き動画です。最初に再生ボタンを押すと、次の動画も続けて視聴できます。 <a href="/help.html#viewing">使い方・ヘルプ</a></footer><script type="module" src="/watch/watch.js"></script></body></html>
